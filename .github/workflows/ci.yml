name: CI

on:
  pull_request:
  push:
    branches-ignore: [ main ]   # main is built (and published) by publish.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # Compiles and tests every module (core, arch, arch-hilt, arch-test, arch-processor).
      - name: Build
        run: ./gradlew build

      # Smoke-test the publishing convention plugin without signing keys.
      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
