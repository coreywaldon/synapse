# Version catalog — the single source of truth for every dependency and plugin version in this build.
# https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog
#
# buildSrc reads this same file (see buildSrc/settings.gradle.kts), so convention plugins and module
# build files share one set of versions. Do not hardcode versions in any build.gradle.kts.

[versions]
kotlin = "2.2.21"
# The Compose compiler Gradle plugin is versioned separately from KGP here. It resolves the compiler
# plugin artifact matching the applied KGP (kotlin-compose-compiler-plugin-embeddable:2.2.21), so the
# mismatch is harmless; it is left as-is to avoid pulling a new plugin artifact.
kotlinComposePlugin = "2.3.10"
# KSP2 (2.3.x) is decoupled from the Kotlin version.
ksp = "2.3.5"
kotlinxCoroutines = "1.10.2"
kotlinxSerialization = "1.8.1"
atomicfu = "0.25.0"
compose = "1.10.1"
# Compose runtime 1.10.1 already upgrades lifecycle to 2.9.4 at resolution time; declare what is actually used.
lifecycle = "2.9.4"
javaxInject = "1"
dagger = "2.51.1"
junit4 = "4.13.2"
junitJupiter = "5.10.0"
kctfork = "0.11.1"
vanniktechPublish = "0.30.0"

[libraries]
# ── Build logic (buildSrc) ──
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
vanniktechPublishPlugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktechPublish" }

# ── Runtime ──
kotlinxCoroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
composeRuntime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
composeRuntimeSaveable = { module = "org.jetbrains.compose.runtime:runtime-saveable", version.ref = "compose" }
lifecycleCommon = { module = "androidx.lifecycle:lifecycle-common", version.ref = "lifecycle" }
lifecycleRuntime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycle" }
javaxInject = { module = "javax.inject:javax.inject", version.ref = "javaxInject" }
hiltCore = { module = "com.google.dagger:hilt-core", version.ref = "dagger" }

# ── Annotation processing ──
kspApi = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }

# ── Testing ──
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junitVintageEngine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junitJupiter" }
kctforkCore = { module = "dev.zacsweers.kctfork:core", version.ref = "kctfork" }
kctforkKsp = { module = "dev.zacsweers.kctfork:ksp", version.ref = "kctfork" }

[plugins]
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinComposePlugin" }
